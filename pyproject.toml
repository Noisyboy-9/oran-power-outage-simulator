[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulator"
version = "0.1.0"
description = "A custom simulator for dependable networking experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
