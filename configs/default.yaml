logging:
  logger_name: simulator
  level: INFO
  destination: stdout
  format: json
  include_logger_name: true
  include_log_level: true
  timestamp:
    key: logged_at
    format: iso
    utc: true
  cache_loggers_on_first_use: true
  propagate: false

environment:
  map:
    width: 20
    height: 20
  ru:
    count: 5
    initial_battery: 100.0
    initial_status: active
    active_consumption: 2.0
    sleep_consumption: 0.5
    coverage_radius: 8.0
  user_count: 30
  random_seed: 42

controller:
  kind: threshold_staggered_active
  threshold_percentage: 50.0

simulation:
  steps: 10000
  metrics:
    collectors:
      - average_emergency_qos
      - average_ru_battery_depletion_time
      - network_lifetime
    minimum_emergency_service_fraction: 0.8
    minimum_service_link_weight: 0.0
